<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beboki — Gra terenowa</title><style>body{margin:0;background:#111;color:#eee;font:16px system-ui}main{max-width:520px;margin:auto;padding:18px}h1{font-size:42px;line-height:1;margin:8px 0 24px}.card{background:#1b1e1a;border:1px solid #343833;border-radius:20px;padding:16px;margin:12px 0}.map{height:320px;position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(135deg,#314238,#172019)}.road{position:absolute;width:140%;height:8px;background:#ffffff18;transform:rotate(-20deg);top:45%;left:-20%}.road:nth-child(2){top:68%;transform:rotate(30deg)}.pin{position:absolute;width:58px;height:58px;border-radius:50%;border:0;font-size:27px;background:#eee;cursor:pointer}.p1{left:68%;top:18%}.p2{left:20%;top:55%}.p3{left:70%;top:67%}.me{position:absolute;left:48%;top:45%;width:16px;height:16px;background:#fff;border-radius:50%}.row{display:flex;gap:14px;align-items:center}.face{width:68px;height:68px;border-radius:18px;background:#303830;display:grid;place-items:center;font-size:38px}.grow{flex:1}.muted{color:#9da69e}.xp{float:right}.btn{width:100%;padding:15px;border:0;border-radius:14px;background:#efe4bd;font-weight:900;margin-top:10px;cursor:pointer}.dark{background:#292f2a;color:white;border:1px solid #3a403b}.quest{display:flex;align-items:center;gap:12px;padding:13px;background:#121512;border:1px solid #303530;border-radius:14px;margin-top:8px;cursor:pointer;color:#fff;width:100%;text-align:left}.lock{opacity:.4}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:end}.modal.show{display:flex}.panel{max-width:520px;width:100%;margin:auto;background:#181b18;border-radius:24px 24px 0 0;padding:20px;box-sizing:border-box}.answers{display:grid;gap:9px}.answers button{padding:14px;border-radius:13px;border:1px solid #3b403b;background:#252a25;color:#fff;text-align:left;cursor:pointer}</style><main><div class="muted">BEBOKI KATOWICE</div><h1>Zaginiony skarb</h1><p class="muted">Przejdź przez centrum Katowic. Znajdź Beboki, rozwiązuj zagadki i zbieraj XP.</p><div class="card"><div class="map"><div class="road"></div><div class="road"></div><div class="me"></div><button class="pin p1" onclick="pick(0)">👹</button><button class="pin p2" onclick="pick(1)">👺</button><button class="pin p3" onclick="pick(2)">👹</button></div></div><div class="card"><span class="muted">XP</span><b class="xp" id="xp">0</b><div class="row"><div class="face" id="face">👹</div><div class="grow"><h2 id="name">Hanys</h2><div class="muted" id="place">Spodek · 1/5</div></div></div><p id="hint">Hanys pilnuje pierwszego tropu. Podejdź pod Spodek.</p><button class="btn" onclick="mission()">ROZPOCZNIJ MISJĘ</button></div><div class="card"><b>TRASA</b><div id="list"></div></div></main><div class="modal" id="modal"><div class="panel" id="panel"></div></div><script>const P=[['Hanys','Spodek','👹','Jaki kolor ma pierwszy znak?',['Czerwony','Zielony','Niebieski'],0,100],['Podciep','Rynek','👺','Ile liter ma słowo BEBOK?',['4','5','6'],1,150],['Hopla','Mariacka','👹','Gdzie czeka Hopla?',['Na Mariackiej','Na Dębowej','Na Kościuszki'],0,150],['Fachura','Plac Wolności','🧔','Czego szukasz?',['Ukrytego symbolu','Paragonu','Biletu'],0,200],['Skarb','Centrum Katowic','🏆','Kto pilnował skarbu?',['Bebok','Kot','Hanys'],0,300]];let cur=0,done=0,xp=0;function render(){let p=P[cur];face.textContent=p[2];name.textContent=p[0];place.textContent=p[1]+' · '+(cur+1)+'/5';document.getElementById('xp').textContent=xp;list.innerHTML=P.map((x,i)=>`<button class="quest ${i>done?'lock':''}" onclick="${i<=done?'pick('+i+')':''}"><span style="font-size:24px">${i<done?'✓':x[2]}</span><span class="grow"><b>${i+1}. ${x[0]}</b><br><small class="muted">${x[1]} · ${i<done?'ODKRYTY':i===done?'AKTYWNY':'ZABLOKOWANY'}</small></span><span>+${x[6]} XP</span></button>`).join('')}function pick(i){if(i>done)return;cur=i;render()}function mission(){let p=P[cur];panel.innerHTML=`<div class="muted">PUNKT ${cur+1}/5 · ${p[1]}</div><div style="font-size:52px">${p[2]}</div><h2>${p[0]}</h2><p>${p[3]}</p><div class="answers">${p[4].map((a,i)=>`<button onclick="answer(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div><button class="btn dark" onclick="closeM()">WRÓĆ</button>`;modal.classList.add('show')}function answer(i){let p=P[cur];if(i!==p[5]){panel.insertAdjacentHTML('beforeend','<p class="muted">❌ Zły trop. Spróbuj jeszcze raz.</p>');return}xp+=p[6];if(cur===done)done=Math.min(P.length,done+1);render();panel.innerHTML=`<div style="font-size:55px">🎉</div><h2>Misja wykonana!</h2><p>+${p[6]} XP. ${done<5?'Następny punkt został odblokowany.':'Ukończyłeś całą przygodę!'}</p><button class="btn" onclick="closeM()">WRÓĆ DO GRY</button>`}function closeM(){modal.classList.remove('show')}render()</script>
